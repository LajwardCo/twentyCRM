# hamagan-management overrides for crm.hamagan.com:
#  - bind the server to localhost only (host nginx terminates TLS in front)
#  - single-workspace (invite-only signup), Claude AI, @hamagan.com SMTP
#  Secrets (ANTHROPIC_API_KEY, EMAIL_SMTP_PASSWORD) live in the box .env, which
#  CI upserts from GitHub Actions secrets; never committed here.
#
#  SMTP note: mail relays via box.lajward.dev:465 (the Mailu box, valid cert for
#  *.lajward.dev) authenticating as crm-auto@hamagan.com. Mailu DKIM-signs as
#  hamagan.com (From domain), so DMARC (p=reject, strict) passes via DKIM.
name: twenty

services:
  server:
    ports: !override
      - "127.0.0.1:3000:3000"
    # This box's docker daemon DNS is misconfigured (daemon.json -> 192.168.203.2),
    # so containers can't resolve external hosts (SMTP box.lajward.dev, AI
    # api.anthropic.com). Point the embedded resolver at public DNS; internal
    # service names (db/redis) still resolve via Docker's embedded server.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      # first boot runs DB migrations; give it room before counting failures
      start_period: 240s
    environment:
      # Twenty requires a valid semver; CI bakes the git SHA which fails
      # config validation, so pin a semver here at runtime.
      APP_VERSION: ${APP_VERSION:-0.2.1}
      # single workspace -> public sign-up auto-closes after the first user
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      # AI assistant (Claude). Key comes from box .env (CI-injected secret).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Speech-to-text for call recordings. No Anthropic model accepts audio
      # input (verified against the Models API: image_input and pdf_input only),
      # so transcription is the one OpenAI dependency in the sales stack.
      # Unset simply disables transcription; the endpoint returns 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # transactional email (invites, password reset, notifications)
      # NOTE: pinned literals (not ${VAR:-}) so a stale box .env can't override
      # them; only the password comes from .env (CI-injected secret).
      EMAIL_FROM_ADDRESS: crm-auto@hamagan.com
      EMAIL_FROM_NAME: Hamagan CRM
      EMAIL_DRIVER: smtp
      EMAIL_SMTP_HOST: box.lajward.dev
      EMAIL_SMTP_PORT: "465"
      EMAIL_SMTP_USER: crm-auto@hamagan.com
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      # Enables workflow CODE steps (executes user-authored JS via a local
      # child-process driver, not remote Lambda). Needed for the sales-crm
      # round-robin lead-assignment workflow's CODE step. Twenty defaults this
      # to LOCAL only when NODE_ENV=development; production needs it explicit.
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Lets a workspace member connect a generic IMAP/SMTP/CalDAV mailbox
      # (not just Google/Microsoft OAuth) -- needed for the Contact Request
      # reply workflow's SEND_EMAIL step to have a connected account to send from.
      IS_IMAP_SMTP_CALDAV_ENABLED: ${IS_IMAP_SMTP_CALDAV_ENABLED:-false}
      # Call recordings would otherwise fill the droplet volume that also holds
      # the database, so attachments move to DigitalOcean Spaces. A bucket
      # lifecycle rule expires audio after 180 days; the CallActivity record
      # and its transcript stay in the DB indefinitely.
      #
      # STORAGE_TYPE is env-gated with a LOCAL default on purpose: pinning S_3
      # here would make the server fail config validation at boot on any box
      # where the bucket secrets are not set yet. Flip it in the box .env only
      # after the bucket and keys exist.
      #
      # STORAGE_S3_REGION must satisfy Twenty's @IsAWSRegion validator
      # (/^[a-z]{2}-[a-z]+-\d$/), which DigitalOcean's own region slugs like
      # 'fra1' do not match. The region is a formality for an S3-compatible
      # endpoint, so a valid-shaped placeholder is used and the real location
      # comes from STORAGE_S3_ENDPOINT.
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}

  worker:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_VERSION: ${APP_VERSION:-0.2.1}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Speech-to-text for call recordings. No Anthropic model accepts audio
      # input (verified against the Models API: image_input and pdf_input only),
      # so transcription is the one OpenAI dependency in the sales stack.
      # Unset simply disables transcription; the endpoint returns 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMAIL_FROM_ADDRESS: crm-auto@hamagan.com
      EMAIL_FROM_NAME: Hamagan CRM
      EMAIL_DRIVER: smtp
      EMAIL_SMTP_HOST: box.lajward.dev
      EMAIL_SMTP_PORT: "465"
      EMAIL_SMTP_USER: crm-auto@hamagan.com
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      # Enables workflow CODE steps (executes user-authored JS via a local
      # child-process driver, not remote Lambda). Needed for the sales-crm
      # round-robin lead-assignment workflow's CODE step. Twenty defaults this
      # to LOCAL only when NODE_ENV=development; production needs it explicit.
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      IS_IMAP_SMTP_CALDAV_ENABLED: ${IS_IMAP_SMTP_CALDAV_ENABLED:-false}
      # Call recordings would otherwise fill the droplet volume that also holds
      # the database, so attachments move to DigitalOcean Spaces. A bucket
      # lifecycle rule expires audio after 180 days; the CallActivity record
      # and its transcript stay in the DB indefinitely.
      #
      # STORAGE_TYPE is env-gated with a LOCAL default on purpose: pinning S_3
      # here would make the server fail config validation at boot on any box
      # where the bucket secrets are not set yet. Flip it in the box .env only
      # after the bucket and keys exist.
      #
      # STORAGE_S3_REGION must satisfy Twenty's @IsAWSRegion validator
      # (/^[a-z]{2}-[a-z]+-\d$/), which DigitalOcean's own region slugs like
      # 'fra1' do not match. The region is a formality for an S3-compatible
      # endpoint, so a valid-shaped placeholder is used and the real location
      # comes from STORAGE_S3_ENDPOINT.
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
